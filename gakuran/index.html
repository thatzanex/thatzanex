<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Redirecting…</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-red: #dc2626;
            --accent-glow: rgba(220, 38, 38, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .mesh-gradient {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 30%, rgba(220, 38, 38, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(220, 38, 38, 0.05) 0%, transparent 40%);
            filter: blur(100px);
        }

        .card {
            text-align: center;
            animation: fade-in 0.6s ease both;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .ring {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 2rem;
        }

        .ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring .track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 4;
        }

        .ring .progress {
            fill: none;
            stroke: var(--accent-red);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 264;
            stroke-dashoffset: 264;
            animation: fill-ring 1.8s ease-in-out forwards;
            filter: drop-shadow(0 0 6px var(--accent-glow));
        }

        @keyframes fill-ring {
            to { stroke-dashoffset: 0; }
        }

        .ring .arrow {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%      { transform: scale(1.12); opacity: 0.7; }
        }

        h1 {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        h1 span { color: var(--accent-red); }

        .sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .sub .dots::after {
            content: '';
            animation: dots 1.2s steps(4) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
        }

        .fallback {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            opacity: 0;
            animation: fade-in 0.6s ease 2.5s forwards;
        }

        .fallback a {
            color: var(--accent-red);
            text-decoration: none;
            border-bottom: 1px solid rgba(220, 38, 38, 0.4);
        }
    </style>
</head>
<body>
    <div class="mesh-gradient"></div>

    <div class="card">
        <div class="ring">
            <svg viewBox="0 0 96 96">
                <circle class="track" cx="48" cy="48" r="42"></circle>
                <circle class="progress" cx="48" cy="48" r="42"></circle>
            </svg>
            <div class="arrow">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 17L17 7"></path>
                    <path d="M7 7h10v10"></path>
                </svg>
            </div>
        </div>

        <h1>Joining <span>Gakuran</span></h1>
        <p class="sub">redirecting to private server<span class="dots"></span></p>

        <p class="fallback">
            Not redirected? <a id="manual-link" href="#">Click here</a>
        </p>
    </div>

    <script>
        const target = "https://www.roblox.com/share?code=eeeabeb43e389b47abc392d6ada8eaa3&type=Server";
        document.getElementById('manual-link').href = target;
        setTimeout(() => { window.location.replace(target); }, 2000);
    </script>
</body>
</html>
